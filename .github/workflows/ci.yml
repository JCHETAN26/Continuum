name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  unit:
    name: Unit (lint, type-check, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.9

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Install Python dependencies
        run: uv sync --all-packages --dev

      - name: Put workspace virtualenv on PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Generate Prisma Client
        run: pnpm db:generate
        env:
          PRISMA_PY_DEBUG_GENERATOR: '1'

      - name: Create .env from example
        run: cp .env.example .env

      - name: Run Linters
        run: pnpm lint

      - name: Run Type Checks
        run: pnpm type-check

      - name: Run Tests
        run: pnpm test

      - name: Build Packages
        run: pnpm build

      - name: Validate Compose Config
        run: docker compose -f infra/docker-compose.yml config -q

  integration:
    name: Integration (Testcontainers)
    runs-on: ubuntu-latest
    services:
      # Only postgres runs as a service container, for the Alembic reversibility
      # step. Redis and MinIO are started by Testcontainers inside the tests
      # themselves; a `services:` block cannot pass the `server /data` command
      # MinIO's entrypoint requires, so it could never become healthy here.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: continuum
          POSTGRES_PASSWORD: continuum
          POSTGRES_DB: continuum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U continuum -d continuum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.9

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Install Python dependencies
        run: uv sync --all-packages --dev

      - name: Create .env from example
        run: cp .env.example .env

      - name: Test Alembic Reversibility
        run: pnpm ops:migrate:test
        env:
          DATABASE_URL: postgresql://continuum:continuum@localhost:5432/continuum?schema=public

      - name: Run Docker Integration Tests
        run: pnpm test:integration

  # Exercises the real LoRA path: PEFT training, merge, and ONNX export. Kept separate
  # from `unit` because the ML extra pulls torch and transformers, which no other job
  # needs. No Docker: the trainer runs against prajjwal1/bert-tiny and a mocked client.
  ml:
    name: ML (PEFT LoRA training)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Install Python dependencies with the PEFT extra
        run: uv sync --all-packages --dev --extra peft

      - name: Create .env from example
        run: cp .env.example .env

      - name: Cache Hugging Face model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bert-tiny

      - name: Run PEFT training integration test
        run: uv run pytest -m integration tests/integration/test_peft_training.py -v
        env:
          RUN_ML_INTEGRATION: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'

  e2e-compose:
    name: E2E (Docker Compose)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.9

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Install Python dependencies
        run: uv sync --all-packages --dev

      - name: Start Compose Stack
        run: docker compose --env-file .env.example -f infra/docker-compose.yml up --build -d --wait

      - name: Run E2E Smoke
        run: pnpm e2e:smoke

      # Measured against the stack the smoke test just exercised, so the numbers reflect
      # the same images and resource limits rather than a bespoke benchmark environment.
      - name: Measure Serving Latency
        run: |
          uv run bench/latency.py --output bench-results/latency.json | tee latency.txt
          {
            echo "### Serving latency (p50/p95/p99)"
            echo '```'
            cat latency.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Independent of the gate the trainer applies to itself: its own scorer counts any
      # same-domain document as relevant, which makes the task nearly free. This asks the
      # model to find one specific post out of every candidate.
      - name: Run Retrieval Benchmark
        run: |
          uv run eval/benchmark.py --output bench-results/retrieval.json | tee retrieval.txt
          {
            echo "### Retrieval benchmark (100 held-out queries)"
            echo '```'
            cat retrieval.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Latency Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench-results/
          if-no-files-found: warn

      # Always, not just on failure. A passing run is exactly when the measured
      # baseline-vs-candidate comparison is worth keeping, and gating this on failure meant
      # the one number the demo exists to produce was discarded on every green run.
      - name: Capture Compose Logs
        if: always()
        # 300 lines per service truncated most of a run: a linguistic window reporting an
        # empty document set was the only line of that service still visible, which made it
        # impossible to tell whether entity extraction had ever run.
        run: docker compose --env-file .env.example -f infra/docker-compose.yml logs --tail=2000

      - name: Stop Compose Stack
        if: always()
        run: docker compose --env-file .env.example -f infra/docker-compose.yml down -v

  load:
    name: Load (synthetic vectors)
    runs-on: ubuntu-latest
    # The demo runs on 1,200 documents, which says nothing about how the data plane behaves
    # at a corpus size worth worrying about. Synthetic vectors cost nothing to generate and
    # exercise the same indexes, so this measures the storage and query paths without paying
    # for a million real embeddings.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: continuum
          POSTGRES_PASSWORD: continuum
          POSTGRES_DB: loadtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U continuum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Install Python dependencies
        run: uv sync --all-packages --dev

      - name: Load and measure
        run: |
          uv run bench/load_vectors.py --count 100000 \
            --output bench-results/load.json | tee load.txt
          {
            echo "### Data plane at 100k vectors"
            echo '```'
            cat load.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          LOAD_TEST_DSN: postgresql://continuum:continuum@localhost:5432/loadtest

      - name: Upload Load Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-results
          path: bench-results/
          if-no-files-found: warn
