name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate (Lint, Type Check, Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.9

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Install Python dependencies
        run: uv sync --all-packages --all-extras --dev

      # prisma generate shells out to the prisma-client-py binary by name, so the
      # workspace virtualenv has to be on PATH rather than reached via `uv run`.
      - name: Put workspace virtualenv on PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # prisma-client-py 0.15.0 asserts it was invoked by Prisma 5.17.0, but the
      # schema uses Prisma 6 syntax (uuid(7)) that 5.17 cannot parse — its own CLI
      # fails validation outright. The Node CLI parses the schema and hands the
      # DMMF to the Python generator, which only the version assert rejects, so
      # bypass that assert. Drop this once prisma-client-py ships Prisma 6 support.
      - name: Generate Prisma Client
        run: pnpm db:generate
        env:
          PRISMA_PY_DEBUG_GENERATOR: '1'

      - name: Run Linters
        run: pnpm lint

      - name: Run Type Checks
        run: pnpm type-check

      - name: Run Tests
        run: pnpm test

      - name: Build Packages
        run: pnpm build

      - name: Validate Compose Config
        run: docker compose config -q

  integration:
    name: Integration (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.9

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Install Python dependencies
        run: uv sync --all-packages --all-extras --dev

      - name: Run Docker Integration Tests
        run: pnpm test:integration
