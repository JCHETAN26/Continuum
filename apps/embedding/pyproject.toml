[project]
name = "continuum-embedding"
version = "0.1.0"
description = "Continuum document embedding worker"
requires-python = ">=3.12"
dependencies = [
    "sentence-transformers>=3.0.0",
    "torch>=2.4.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "continuum-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
continuum-shared = { workspace = true }
