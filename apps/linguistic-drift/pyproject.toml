[project]
name = "continuum-linguistic-drift"
version = "0.1.0"
description = "Continuum linguistic drift detection service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "confluent-kafka>=2.4.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "structlog>=24.4.0",
    "continuum-shared",
]

[project.optional-dependencies]
# Named entity recognition. Light enough to install into the service image.
nlp = [
    "spacy>=3.7.5",
]

# Topic modelling. Kept separate because bertopic depends on sentence-transformers and so
# pulls torch, umap-learn, hdbscan, numba and pandas: 38 packages, into a service that
# otherwise needs none of them. See the note in analyzer.py on why the keyword backend is
# the default for windows of this size.
topics = [
    "bertopic>=0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
continuum-shared = { workspace = true }
