[project]
name = "continuum-trainer"
version = "0.1.0"
description = "Continuum model trainer and registry"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "confluent-kafka>=2.5.0",
    "rq>=1.16.2",
    "redis>=5.0.4",
    "onnx>=1.16.1",
    "onnxruntime>=1.18.0",
    "minio>=7.2.7",
    "structlog>=24.4.0",
    "continuum-shared",
]

[project.optional-dependencies]
peft = [
    "datasets>=2.20.0",
    "peft>=0.11.1",
    "sentence-transformers>=3.0.1",
    "torch>=2.3.1",
    "transformers>=4.43.0",
    "optimum[onnxruntime]>=1.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
continuum-shared = { workspace = true }
