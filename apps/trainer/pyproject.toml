[project]
name = "continuum-trainer"
version = "0.1.0"
description = "Continuum model trainer and registry"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "rq>=1.16.2",
    "redis>=5.0.4",
    "transformers>=4.41.0",
    "peft>=0.11.1",
    "optimum>=1.20.0",
    "onnx>=1.16.1",
    "minio>=7.2.7",
    "structlog>=24.4.0",
    "continuum-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
continuum-shared = { workspace = true }
