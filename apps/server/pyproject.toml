[project]
name = "continuum-server"
version = "0.1.0"
description = "Continuum high-performance embedding server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "grpcio>=1.64.1",
    "onnxruntime>=1.18.0",
    "tokenizers>=0.19.1",
    "minio>=7.2.7",
    "prometheus-client>=0.20.0",
    "structlog>=24.4.0",
    "continuum-shared",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.64.1",
    "locust>=2.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
continuum-shared = { workspace = true }
