[project]
name = "continuum-ingest"
version = "0.1.0"
description = "Continuum document ingestion API and worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "confluent-kafka>=2.5.0",
    "minio>=7.2.8",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-confluent-kafka>=0.48b0",
    "continuum-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
continuum-shared = { workspace = true }
