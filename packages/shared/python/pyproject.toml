[project]
name = "continuum-shared"
version = "0.1.0"
description = "Shared configuration and domain types for Continuum"
authors = [{ name = "Continuum Team" }]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "bcrypt>=4.2.0",
    "fastapi>=0.111.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "prisma>=0.13.1",
    "psycopg[binary]>=3.2.0",
    "structlog>=24.4.0",
    "numpy>=1.26.0",
    "onnxruntime>=1.18.0",
    "tokenizers>=0.20.0",
    "huggingface-hub>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
